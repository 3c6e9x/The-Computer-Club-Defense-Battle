{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Defense Battle</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
</head>
<body>
    <div class="index-shell">
        <div class="index-bg"></div>
        <div class="index-overlay">
            <div class="title-block">
                <img class="title-image" src="{% static 'images/title.jpg' %}" alt="Game Title" />
            </div>
            <div class="menu-panel">
                <a class="menu-btn" href="{% url 'haruhi:story' %}">开始游戏</a>
            </div>
        </div>
    </div>

    <!-- 背景音乐 -->
    <audio id="bgm" autoplay loop>
        <source src="{% static 'music/神前暁 - いつもの風景.mp3' %}" type="audio/mpeg">
        您的浏览器不支持音频播放
    </audio>

    <script>
        document.querySelector('.index-bg').style.backgroundImage = `url("{% static 'images/background2.png' %}")`;

        const bgm = document.getElementById('bgm');
        bgm.volume = 0.5;

        // 尝试自动播放，被拦截则在用户首次交互后播放
        bgm.play().catch(() => {
            console.log('Autoplay blocked, waiting for user interaction...');
            function onInteract() {
                bgm.play();
                document.removeEventListener('click', onInteract);
                document.removeEventListener('keydown', onInteract);
            }
            document.addEventListener('click', onInteract);
            document.addEventListener('keydown', onInteract);
        });
    </script>
</body>
</html>
