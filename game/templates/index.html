{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Defense Battle</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
</head>
<body>
    <div class="index-shell">
        <div class="index-bg"></div>
        <div class="index-overlay">
            <div class="title-block">
                <img class="title-image" src="{% static 'images/title.jpg' %}" alt="Game Title" />
            </div>
            <div class="menu-panel">
                <a class="menu-btn" href="{% url 'haruhi:story' %}">开始游戏</a>
                <a class="menu-btn menu-btn-secondary" href="#">存档</a>
            </div>
        </div>
    </div>

    <!-- 背景音乐 -->
    <audio id="bgm" autoplay loop>
        <source src="{% static 'music/神前暁 - いつもの風景.mp3' %}" type="audio/mpeg">
        您的浏览器不支持音频播放
    </audio>

    <script>
        document.querySelector('.index-bg').style.backgroundImage = `url("{% static 'images/background2.png' %}")`;
        
        // 背景音乐控制
        const bgm = document.getElementById('bgm');
        bgm.volume = 0.5; // 设置音量为50%
        
        // 处理自动播放政策
        bgm.play().catch(function(error) {
            console.log('自动播放被阻止，用户需要交互后才能播放');
        });
    </script>
</body>
</html>
