<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Story</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
</head>
<body>
    <div class="story-visual" id="story-visual">
        <div class="dialogue-box" id="dialogue-box">
            <div class="dialogue-title" id="dialogue-title">视觉小说</div>
            <div class="dialogue-text" id="dialogue-text">点击屏幕开始你的故事。</div>
            <div class="dialogue-hint">点击任意位置继续</div>
        </div>
    </div>
    
    <!-- 背景音乐 -->
    <audio id="bgm" autoplay loop>
        <source src="{% static 'music/bgm.mp3' %}" type="audio/mpeg">
        您的浏览器不支持音频播放
    </audio>

    <script src="{% static 'js/story.js' %}"></script>
    
    <script>
        // 背景音乐控制
        const bgm = document.getElementById('bgm');
        bgm.volume = 0.5; // 设置音量为50%
        
        // 处理自动播放政策
        bgm.play().catch(function(error) {
            console.log('自动播放被阻止，用户需要交互后才能播放');
        });
    </script>
</body>
</html>
