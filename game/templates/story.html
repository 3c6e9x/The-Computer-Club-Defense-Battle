<!DOCTYPE html>
{% load static %}
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Story</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <style>
        .story-visual {
            background: linear-gradient(180deg, rgba(16, 18, 27, 0.3) 0%, rgba(7, 9, 15, 0.7) 100%), url("{% static 'images/story_background.png' %}") center/cover no-repeat;
        }
    </style>
</head>
<body>
    <div class="story-visual" id="story-visual">
        <div class="dialogue-box" id="dialogue-box">
            <div class="dialogue-title" id="dialogue-title"></div>
            <div class="dialogue-text" id="dialogue-text"></div>
        </div>
    </div>

    <!-- 场景音乐播放器 -->
    <audio id="scene-music" preload="auto"></audio>

    <script src="{% static 'js/story.js' %}"></script>
</body>
</html>
