<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Story</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <style>
        .story-visual {
            background: linear-gradient(180deg, rgba(16, 18, 27, 0.3) 0%, rgba(7, 9, 15, 0.7) 100%), url("{% static 'images/background1.png' %}") center/cover no-repeat;
        }
    </style>
</head>
<body>
    <div class="story-visual" id="story-visual">
        <div class="dialogue-box" id="dialogue-box">
            <div class="dialogue-header">
                <div class="dialogue-avatar">
                    <img id="dialogue-avatar-img" src="" alt="头像" />
                </div>
                <div class="dialogue-title" id="dialogue-title">视觉小说</div>
            </div>
            <div class="dialogue-text" id="dialogue-text">点击屏幕开始你的故事。</div>
        </div>
    </div>
    
    <!-- 背景音乐 -->
    <audio id="bgm" autoplay loop>
        <source src="{% static 'music/bgm.mp3' %}" type="audio/mpeg">
        您的浏览器不支持音频播放
    </audio>

    <script src="{% static 'js/story.js' %}"></script>
    
    <script>
        // 背景音乐控制
        const bgm = document.getElementById('bgm');
        bgm.volume = 0.5; // 设置音量为50%
        
        // 处理自动播放政策
        bgm.play().catch(function(error) {
            console.log('自动播放被阻止，用户需要交互后才能播放');
        });
    </script>
</body>
</html>
